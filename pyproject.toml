[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oxebots-rl-ssl"
version = "1.0.0"
description = "OxeBots SSL and VSS robot soccer gym environments and RL training framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0.0",
    "rc-robosim>=1.2.0",
    "pygame>=2.6.0",
    "protobuf>=3.20.0",
    "pyyaml>=6.0.0",
    "numpy>=1.21.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "stable-baselines3>=2.3.0",
    "torch>=2.0.0",
    "tensorboard>=2.15.0",
    "onnx>=1.15.0",
    "onnxscript>=0.1.0",
    "onnxruntime>=1.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
