name: CI

on:
  push:
    branches: [main, "feat/*", "fix/*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code style and linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: ruff check .

      - name: Verify zero emojis in repository
        run: |
          python -c "import re, subprocess, sys
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          pattern = re.compile(r'[\U00010000-\U0010ffff]')
          found = 0
          for f in tracked:
              if f.endswith(('.zip', '.onnx', '.png', '.jpg', '.so', '.pyc')):
                  continue
              try:
                  with open(f, 'r', encoding='utf-8') as fp:
                      for idx, line in enumerate(fp, 1):
                          m = pattern.search(line)
                          if m:
                              print(f'{f}:{idx}: {m.group(0)} -> {line.strip()[:80]}')
                              found += 1
              except Exception:
                  pass
          if found > 0:
              print(f'[FAIL] Found {found} emojis in repository.')
              sys.exit(1)
          print('[OK] Zero emojis detected.')"

  test:
    name: Unit and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest

      - name: Run test suite
        run: pytest tests/ -v
