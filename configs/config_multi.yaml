# ==============================================================================
# CONFIGURAÇÃO DE TREINO: MULTI-AGENT (MAPPO / CTDE) - OXEBOTS RL-SSL
# ==============================================================================

# Modo de Treinamento
mode: "multi-agent"

# --- AMBIENTE E ATUADORES FÍSICOS DOS ROBÔS ---
environment:
  id: "SSL-EL-Coop-v0"         # Ambiente Cooperativo SSL Entry Level (2 Atacantes Azuis vs Defesa)
  max_steps: 800               # Duração máxima do episódio (20s @ 40Hz)
  
  # Atuadores físicos (Hardware):
  enable_dribbler: false       # true: ativa motor do drible | false: desativado (SSL-EL padrão)
  enable_kicker: true          # true: permite chutar a bola | false: sem chute (apenas condução)

# --- RECOMPENSAS E PENALIDADES (Ative/Desative com Booleano e Ajuste o Valor) ---
rewards:
  goal:
    enabled: true
    value: 60.0                # Bônus coletivo por gol marcado
  pass_completed:
    enabled: true
    value: 15.0                # Bônus por passe completado com sucesso entre os atacantes
  ball_to_goal:
    enabled: true
    value: 4.0                 # Peso do avanço coletivo da bola até o gol (PBRS)
  infrared:
    enabled: true
    value: 0.05                # Bônus de recepção e posse direta

penalties:
  area_violation:
    enabled: true
    value: -10.0               # Penalidade caso qualquer um dos atacantes invada a área
  out_of_bounds:
    enabled: true
    value: -2.0                # Punição por chutar ou sair de campo
  own_goal:
    enabled: true
    value: -25.0               # Penalidade por gol contra
  time_cost:
    enabled: true
    value: -0.015              # Custo por passo

# --- OS 2 PONTOS DE MONITORAMENTO ---
monitoring:
  # 1. TensorBoard (Curvas de aprendizado no navegador: http://localhost:6006)
  enable_tensorboard: true
  tensorboard_dir: "./logs/tensorboard_multi/"

  # 2. Checkpoints (Pasta que o play_live.py assiste em tempo real no Pygame)
  checkpoints_dir: "./logs/checkpoints_multi/"
  save_freq_steps: 50000       # Salva checkpoint a cada 50k passos

# --- FLUXO DO TREINAMENTO ---
training:
  use_cuda: true               # true: roda em GPU (se disponível) | false: CPU
  resume_training: true        # true: continua do checkpoint mais recente se existir
  clean_old_checkpoints: true  # true: limpa checkpoints intermediários antigos
  auto_export_onnx: true       # true: exporta ator descentralizado para ONNX ao terminar
  progress_bar: true           # true: barra de progresso no terminal
  
  total_timesteps: 5000000     # Passos totais de simulação
  n_envs: 8                    # Ambientes paralelos
  seed: 42
  final_model_path: "./modelos/ssl_el_multi_final"

# --- HIPERPARÂMETROS DO MAPPO ---
mappo:
  actor_lr: 0.0003
  critic_lr: 0.0005
  n_steps: 1024
  batch_size: 128
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
