# ==============================================================================
# CONFIGURAÇÃO UNIVERSAL OXEBOTS RL-SSL
# Alterne entre Single e Multi-Agent apenas mudando mode_single (true / false)!
# ==============================================================================

# --- MODO DE TREINAMENTO (BOOLEANO PRINCIPAL) ---
mode_single: true              # true: Single-Agent (SB3 PPO) | false: Multi-Agent (MAPPO)

# --- AMBIENTE E ATUADORES FÍSICOS DO ROBÔ ---
environment:
  id: "SSL-EL-v0"              # Ambiente oficial SSL Entry Level (Campo 4.5m x 3.0m)
  max_steps: 600               # Duração máxima do episódio (15s @ 40Hz)
  
  # Atuadores físicos (Hardware):
  enable_dribbler: false       # true: ativa motor do drible | false: desativado (padrão SSL-EL)
  enable_kicker: true          # true: permite chutar a bola | false: sem chute (apenas condução)

  # Dimensões e Presets do Campo (Entry Level vs Divisão B):
  # Para mudar para a Divisão B, basta alterar preset para "division_b" (ou ajustar as medidas abaixo)
  field:
    preset: "entry"            # Opções: "entry" (4.5m x 3.0m) | "division_b" (9.0m x 6.0m) | "custom"
    length: 4.5                # Comprimento do campo em metros (Entry: 4.5 | Divisão B: 9.0)
    width: 3.0                 # Largura do campo em metros (Entry: 3.0 | Divisão B: 6.0)
    penalty_length: 0.50       # Comprimento da área de pênalti em metros (Entry: 0.50 | Divisão B: 1.0)
    penalty_width: 1.350       # Largura da área de pênalti em metros (Entry: 1.350 | Divisão B: 2.0)
    goal_width: 0.70           # Largura do gol em metros (Entry: 0.70 | Divisão B: 1.0)
    goal_depth: 0.18           # Profundidade do gol em metros (0.18)

# --- RECOMPENSAS E PENALIDADES (Ative/Desative com Booleano e Ajuste o Valor) ---
rewards:
  goal:
    enabled: true
    value: 50.0                # Bônus por gol marcado
  shot_on_goal:
    enabled: true
    value: 10.0                # Bônus por chute potente em direção à meta
  move_to_ball:
    enabled: true
    value: 2.0                 # Peso do gradiente de aproximação até a bola (PBRS)
  ball_to_goal:
    enabled: true
    value: 5.0                 # Peso do avanço da bola até o gol adversário (PBRS)
  alignment:
    enabled: true
    value: 0.5                 # Bônus angular para alinhar a frente do robô atrás da bola
  infrared:
    enabled: true
    value: 0.05                # Bônus de toque direto no sensor óptico/chutador
  
  # Recompensas específicas para quando mode_single = false (Multi-Agent):
  pass_completed:
    enabled: true
    value: 15.0                # Bônus por passe completado com sucesso entre atacantes
  support_position:
    enabled: true
    value: 3.0                 # Bônus de desmarcação do robô sem bola

penalties:
  area_violation:
    enabled: true
    value: -10.0               # Penalidade por invadir a área de pênalti (1.35m x 0.50m)
  out_of_bounds:
    enabled: true
    value: -2.0                # Punição por sair do campo ou chutar para fora
  own_goal:
    enabled: true
    value: -20.0               # Penalidade severa caso a bola entre no próprio gol
  time_cost:
    enabled: true
    value: -0.015              # Custo por passo (força rapidez)
  energy_cost:
    enabled: true
    value: 0.0001              # Custo por velocidade/giro (evita vibração excessiva)

# --- OS 2 PONTOS DE MONITORAMENTO ---
monitoring:
  # 1. TensorBoard (Curvas de aprendizado no navegador: http://localhost:6006)
  enable_tensorboard: true
  tensorboard_dir: "./logs/tensorboard/"

  # 2. Checkpoints (Pasta que o play_live.py assiste em tempo real no Pygame)
  checkpoints_dir: "./logs/checkpoints/"
  save_freq_steps: 50000       # Salva checkpoint a cada 50k passos totais

# --- FLUXO DO TREINAMENTO ---
training:
  use_cuda: true               # true: roda em GPU (se disponível) | false: CPU
  resume_training: true        # true: se existir modelo anterior salvo, continua dele
  clean_old_checkpoints: true  # true: limpa checkpoints intermediários antigos
  auto_export_onnx: true       # true: exporta automaticamente para ONNX ao terminar
  progress_bar: true           # true: barra de progresso no terminal
  
  total_timesteps: 5000000     # Passos totais de simulação
  n_envs: 8                    # Processos paralelos simultâneos
  seed: 42
  final_model_path: "./modelos/ssl_el_final"

# --- HIPERPARÂMETROS STABLE-BASELINES3 (PPO - Single-Agent) ---
ppo:
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 128
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005

# --- HIPERPARÂMETROS MAPPO (Multi-Agent) ---
mappo:
  actor_lr: 0.0003
  critic_lr: 0.0005
  n_steps: 1024
  batch_size: 128
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
